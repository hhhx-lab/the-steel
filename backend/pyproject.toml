[project]
name = "tiezi-backend"
version = "0.1.0"
description = "FastAPI backend for the Tiezi MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.3",
  "fastapi>=0.115.6",
  "httpx>=0.28.1",
  "openai>=1.59.6",
  "pydantic-settings>=2.7.1",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.34.0"
]

[dependency-groups]
dev = [
  "pytest>=8.3.4"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
